<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wealthly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Wealthly — Le patrimoine de votre famille, enfin clair</title>
    <meta name="description" content="Wealthly rassemble tous vos comptes, placements et biens dans un tableau de bord moderne. Pour particuliers et familles qui veulent piloter leur patrimoine sans complexité." />

    <!-- No-flash theme: applied before first paint so the first frame matches user preference. -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('wealthly-theme');
          if (!t) {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Wealthly typography v3 (Claude Design handoff):
         Geist     — UI sans (95% de l'app)
         Geist Mono — IBAN, codes, axes
         Newsreader — UNIQUEMENT hero patrimoine + chapitres éditoriaux -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

    <style>
      :root { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      html, body {
        margin: 0;
        background: #F7F6F2;
        color: #16150F;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      :root[data-theme="dark"] html, :root[data-theme="dark"] body {
        background: #0F0E0C;
        color: #F1EEE4;
      }
      /* Spinner pendant le chargement React */
      #root:empty::after {
        content: ''; position: fixed; inset: 0;
        background: var(--bg, #F7F6F2);
      }
      #root:empty::before {
        content: ''; position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 28px; height: 28px;
        border: 2px solid var(--border, #E4E1D8);
        border-top-color: var(--accent, #2540D9);
        border-radius: 50%;
        animation: ws 0.7s linear infinite;
        z-index: 1;
      }
      @keyframes ws { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Wake up Railway backend immediately (fire-and-forget, before JS bundle parses).
         Passes via /api proxy (Vercel rewrite) pour rester same-origin. -->
    <script>try{fetch('/api/health').catch(function(){});}catch(e){}</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
