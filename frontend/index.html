    <style>
      body { margin: 0; background: #0c0d10; }
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #0c0d10;
      }
      #root:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 28px;
        border: 2px solid #232730;
        border-top-color: #c5a572;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        z-index: 1;
      }
      @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- DM Sans (UI body, headings) + DM Mono (numbers, currency, tabular data).
         Source Serif 4 (editorial hero numbers, italic accents — Méridien direction).
         Variable axes requested as ranges so a single woff2 covers each font. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,300;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
    <style>
      /* Prevents the white flash on first paint before React mounts */
      html, body { background: #0a0b0e; color: #ebe8e3; color-scheme: dark; margin: 0; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
