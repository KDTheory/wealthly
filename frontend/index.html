<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151926" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trove" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Trove — Le patrimoine de votre famille, enfin clair</title>
    <meta name="description" content="Trove rassemble tous vos comptes, placements et biens dans un tableau de bord moderne. Pour particuliers et familles qui veulent piloter leur patrimoine sans complexité." />
    <style>
      body { margin: 0; background: #151926; }
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #151926;
      }
      #root:empty::before {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 28px;
        border: 2px solid #2f3548;
        border-top-color: #5285ee;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        z-index: 1;
      }
      @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Trove typography: Inter Tight (UI + numbers, full tnum support).
         JetBrains Mono kept for occasional code/technical labels. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Prevents the white flash on first paint before React mounts */
      html, body {
        background: #151926;
        color: #f5f5f7;
        color-scheme: dark;
        margin: 0;
        font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Wake up Railway backend immediately (fire-and-forget, before JS bundle parses) -->
    <script>try{fetch('https://wealthly-production-45aa.up.railway.app/health').catch(function(){});}catch(e){}</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
